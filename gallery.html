
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みなさんのおえかき美術館</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0faff;
      color: #425466;
      font-family: sans-serif;
      line-height: 1.8;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .museum {
      padding: 32px 24px;
      background: #ffffff;
      border: 2px solid #d5edf8;
      border-radius: 24px;
      text-align: center;
    }

    .emoji {
      font-size: 56px;
      margin-bottom: 12px;
    }

    h1 {
      color: #579fc2;
      font-size: 27px;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #579fc2;
      font-weight: bold;
    }

    .preparing {
      margin-top: 28px;
      padding: 20px;
      background: #f0faff;
      border-radius: 16px;
    }

    .preparing strong {
      color: #579fc2;
      font-size: 18px;
    }

    .back {
      display: inline-block;
      margin-top: 24px;
      color: #579fc2;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="museum">
      <div class="emoji">🖼️</div>

      <h1>みなさんのおえかき美術館</h1>

      <p class="subtitle">
        みなさんの「描けた！」が集まる場所 🎨
      </p>

      <p>
        ここでは、みなさんが描いて送ってくれた作品を
        ご紹介していく予定です！
      </p>

      <div class="preparing">
        <strong>🌱 ただいま準備中！ 🌱</strong>
        <p>
          みなさんの作品を飾る準備をしています。
          どんな作品が集まるのか、お楽しみに〜！🩵
        </p>
      </div>

      <a class="back" href="index.html">
        ← お絵かきルームのトップへ戻る
      </a>
    </main>
  </div>
</body>
</html>
